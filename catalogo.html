<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="cabecalho">
        <h1>Plantae Acessível</h1>
    </header>

    <main class="container">

        <div class="card">
            <div class="nomes">
                <h2>Catálogo de Plantas</h2>
                <p>Explore nosso jardim!</p>
            </div>


            <div class="informcoes">
                <label for="pesquisa">Digite o nome da planta:</label>
                <input id="pesquisa" name="pesquisa" type="text" placeholder="Ex: Lavanda..."
                    style="width: 100%; margin-top: 5px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                <input type="button" value="Buscar"
                    style="width: 100%; margin-top: 8px; padding: 8px; background: #1A4326; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">
            </div>

            <div class="card">
                <img src="imagens/lavanda.png" alt="Lavanda">


                <div class="nomes">
                    <h2>Lavanda</h2>
                    <p>Lavandula angustifolia</p>
                </div>
                <div class="saberMais">Saber Mais</div>


            </div>
        </div>

        </div>

    </main>

</body>

</html>
