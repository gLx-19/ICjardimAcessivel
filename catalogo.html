<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Catálogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

    <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Logotipo do Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav" id="menuNavegacaoCatalogo" aria-label="Navegação principal">
                <a href="index.html">Início</a>
            </nav>
        </div>
    </header>

    <main id="conteudo-principal" class="container" tabindex="-1">
        <div class="card">
            <div class="nomes">
                <h2>Catálogo de Plantas</h2>
                <p>Explore nosso jardim!</p>
            </div>

            <section class="pesquisa" aria-labelledby="tituloPesquisa">
                <h3 id="tituloPesquisa">Pesquisar Planta</h3>
                <form id="formPesquisa" role="search" aria-label="Formulário de pesquisa de plantas">
                    <label for="pesquisa" class="sr-only">Digite o nome da planta</label>
                    <input type="search" id="pesquisa" placeholder="Digite o nome da planta">
                    <button type="submit" class="btn-pesquisar">
                        Buscar
                    </button>
                </form>
            </section>

            <p id="statusPesquisa" class="sr-only" aria-live="polite" aria-atomic="true"></p>

            <section id="listaPlantas" class="catalogo" aria-label="Lista de plantas do jardim">
            </section>
        </div>
    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p id="textoRodapeJardim">&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
            <p class="footer-admin-link">
                <a href="login.html">Acesso Restrito (Gestão)</a>
            </p>
        </div>
    </footer>

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        if (window.VLibras) {
            new window.VLibras.Widget('https://vlibras.gov.br/app');
        }
    </script>
    <script src="js/catalogo.js"></script>
</body>
</html>
