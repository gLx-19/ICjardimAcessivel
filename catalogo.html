<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Catálogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="cabecalho">
        <h1>Plantae Acessível</h1>
    </header>

    <main class="container">

        <div class="card">

            <div class="nomes">
                <h2>Catálogo de Plantas</h2>
                <p>Explore nosso jardim!</p>
            </div>

            <!-- Pesquisa -->

            <div class="pesquisa">

                <h3>Pesquisar Planta</h3>

                <form id="formPesquisa">

                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Digite o nome da planta">

                    <button
                        type="submit"
                        class="btn-pesquisar">
                        Buscar
                    </button>

                </form>

            </div>

            <!-- Lista de plantas -->

            <div id="listaPlantas" class="catalogo">

                <!--
                    Os cards serão adicionados aqui
                    pelo JavaScript.
                -->

            </div>

        </div>

    </main>

    <script src="js/catalogo.js"></script>

</body>

</html>
