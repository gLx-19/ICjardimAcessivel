<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Catálogo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="card">

            <div class="nomes">
                <h2>Catálogo de Plantas</h2>
                <p>Explore nosso jardim!</p>
            </div>

            <!-- Pesquisa -->

            <div class="pesquisa">

                <h3>Pesquisar Planta</h3>

                <form id="formPesquisa">

                    <input type="text" id="pesquisa" placeholder="Digite o nome da planta">

                    <button type="submit" class="btn-pesquisar">
                        Buscar
                    </button>

                </form>

            </div>

            <!-- Lista de plantas -->

            <div id="listaPlantas" class="catalogo">

                <!--
                    Os cards serão adicionados aqui
                    pelo JavaScript.
                -->

            </div>

        </div>

    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>

    <script src="js/catalogo.js"></script>
</body>
</body>

</html>
