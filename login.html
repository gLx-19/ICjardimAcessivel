<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

    <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Logotipo do Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav" aria-label="Navegação de retorno">
                <a href="index.html" aria-label="Voltar para a página inicial">
                    Voltar ao Início
                </a>
            </nav>
        </div>
    </header>

    <main id="conteudo-principal" class="container d-flex flex-column align-items-center justify-content-center" tabindex="-1">
        <form id="formulario" class="p-4 border rounded shadow-sm bg-white form-autenticacao" aria-label="Formulário de acesso ao sistema">
            <fieldset>
                <legend class="text-center mb-4 fw-bold">Acesso Restrito (Gestão)</legend>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="cpf">CPF</label>
                    <input class="form-control" id="cpf" name="cpf" type="text" inputmode="numeric" autocomplete="username" placeholder="Digite seu CPF (apenas números)" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold" for="senha">Senha</label>
                    <input class="form-control" id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <a class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center" href="cliente.html" aria-label="Ir para a tela de cadastro de novo usuário">
                            Cadastrar
                        </a>
                    </div>
                    <div class="col-6">
                        <button class="btn-principal w-100" type="button" onclick="autenticar()" aria-label="Confirmar login">
                            Entrar
                        </button>
                    </div>
                </div>
            </fieldset>
        </form>
    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
