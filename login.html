<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="bg-success text-white py-3 shadow">
        <div class="container d-flex justify-content-between align-items-center">

            <div class="d-flex align-items-center gap-2">
                <img src="imagens/logo.png" alt="Plantae Acessível" width="40" height="40">
                <h1 class="h4 m-0">Plantae Acessível</h1>
            </div>

            <nav>
                <a href="index.html" class="text-white text-decoration-none fw-semibold">
                    ⬅ Voltar
                </a>
            </nav>

        </div>
    </header>

    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100">

        <form id="formulario" class="p-4 border rounded shadow-sm bg-white" style="width: 100%; max-width: 400px;">

            <fieldset>
                <legend class="text-center mb-4 text-success fw-bold">
                    Plantae Acessível
                </legend>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="cpf">CPF</label>
                    <input class="form-control" id="cpf" name="cpf" type="text"
                        placeholder="Digite seu CPF (apenas números)" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold" for="senha">Senha</label>
                    <input class="form-control" id="senha" name="senha" type="password"
                        placeholder="Sua senha" required>
                </div>

                <div class="row g-2">
                    <div class="col-6">
                        <a class="btn btn-outline-success w-100" href="cliente.html">
                            Cadastrar
                        </a>
                    </div>

                    <div class="col-6">
                        <button class="btn btn-success w-100" type="button" onclick="autenticar()">
                            Login
                        </button>
                    </div>
                </div>

            </fieldset>
        </form>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
