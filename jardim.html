<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Jardins</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="cabecalhoNav">
    <div class="header-container">
        <div class="logo-area">
            <img src="imagens/logo.png" alt="Plantae Acessível" class="logo-img">
            <h1>Plantae Acessível</h1>
        </div>

        <nav class="menu-nav">
            <a href="menuUsuario.html">⬅ Voltar ao Menu Inicial</a>
        </nav>
    </div>
</header>

    <main class="container">

        <div class="card">

            <div class="nomes">
                <h2>🌳 Jardins</h2>
                <p>Gerencie os jardins cadastrados.</p>
            </div>

            <!-- PESQUISA -->

            <section class="pesquisa">

                <h3>Pesquisar Jardim</h3>

                <form id="formPesquisa">

                    <input type="text" id="pesquisa" placeholder="Digite o nome do jardim">

                    <button type="submit" class="btn-pesquisar">

                        🔍 Pesquisar

                    </button>

                </form>

            </section>

            <!-- LISTA -->

            <section class="lista-plantas">

                <h3>Jardins cadastrados</h3>

                <div id="listaJardins">

                    <!-- Jardins serão carregados pelo JavaScript -->

                    <div class="planta-item">

                        <span>🌳 Jardim Principal</span>

                        <div class="acoes">

                            <button class="btn-ver">
                                Ver
                            </button>

                            <button class="btn-editar">
                                Editar
                            </button>

                            <button class="btn-excluir">
                                Excluir
                            </button>

                        </div>

                    </div>

                </div>

            </section>

            <!-- CADASTRO -->

            <section class="cadastro">

                <h3>Cadastrar Novo Jardim</h3>

                <form id="formCadastro">

                    <label for="nome">
                        Nome
                    </label>

                    <input type="text" id="nome" required>

                    <label for="localizacao">
                        Localização
                    </label>

                    <input type="text" id="localizacao" placeholder="Ex.: Bloco A - Entrada">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea id="descricao" rows="5" placeholder="Descrição do jardim">
                    </textarea>

                    <button type="submit" class="btn-principal">

                        Confirmar Cadastro

                    </button>

                </form>

            </section>

        </div>

    </main>
    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>

    <script src="js/jardim.js"></script>

</body>

</html>
