<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

    <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Logotipo do Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav" aria-label="Navegação de retorno">
                <a href="menuUsuario.html" aria-label="Voltar ao Painel de Gestão">Voltar ao Menu Inicial</a>
            </nav>
        </div>
    </header>

    <main id="conteudo-principal" class="container" tabindex="-1">
        <div class="card">
            <div class="nomes">
                <h2>Tarefas</h2>
                <p>Gerencie as tarefas do jardim.</p>
                <button type="button" id="btnNovaTarefa" class="btn-principal btn-acao-topo" aria-label="Abrir formulário para criar nova tarefa">
                    Criar Nova Tarefa
                </button>
            </div>

            <section class="pesquisa" aria-labelledby="tituloPesquisa">
                <h3 id="tituloPesquisa">Pesquisar Tarefa</h3>
                <form id="formPesquisa" role="search" aria-label="Formulário de pesquisa de tarefas">
                    <label for="pesquisa" class="sr-only">Digite o termo de busca para filtrar</label>
                    <input type="search" id="pesquisa" placeholder="Digite o termo de busca para filtrar">
                    <button type="submit" class="btn-pesquisar">Pesquisar</button>
                </form>
            </section>

            <section class="lista-plantas" aria-labelledby="tituloLista">
                <h3 id="tituloLista">Tarefas cadastradas</h3>
                <div id="listaTarefas" aria-live="polite" aria-label="Lista de resultados de tarefas">
                </div>
            </section>

            <section class="cadastro" aria-labelledby="tituloFormulario" hidden>
                <h3 id="tituloFormulario">Cadastrar Nova Tarefa</h3>
                <form id="formCadastro" aria-label="Formulário de criação e edição de tarefa">
                    <label for="titulo">Título da Tarefa</label>
                    <input type="text" id="titulo" placeholder="Ex: Regar as Samambaias" required>

                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="4" placeholder="Descreva os detalhes da tarefa" required></textarea>

                    <label for="prazo">Prazo (Data Prevista)</label>
                    <input type="date" id="prazo" required>

                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Pendente">Pendente</option>
                        <option value="Concluída">Concluída</option>
                    </select>

                    <button type="submit" class="btn-principal">Confirmar Cadastro</button>
                </form>
            </section>
        </div>
    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>
    <script src="js/tarefas.js"></script>
</body>
</html>
