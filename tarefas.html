<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Tarefas</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

   <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav">
                <a href="menuUsuario.html">⬅ Voltar ao Menu Inicial</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <div class="nomes">
                <h2>📋 Tarefas</h2>
                <p>Gerencie as tarefas do jardim.</p>
                
                <button id="btnNovaTarefa" class="btn-principal" style="margin-top: 15px; background-color: #28a745; width: auto; padding: 10px 20px;">
                    ➕ Criar Nova Tarefa
                </button>
            </div>

            <section class="pesquisa">
                <h3>Pesquisar Tarefa</h3>
                <form id="formPesquisa">
                    <input type="text" id="pesquisa" placeholder="Digite o termo de busca para filtrar">
                    <button type="submit" class="btn-pesquisar">🔍 Pesquisar</button>
                </form>
            </section>

            <section class="lista-plantas">
                <h3>Tarefas cadastradas</h3>
                <div id="listaTarefas">
                    </div>
            </section>

            <section class="cadastro">
                <h3 id="tituloFormulario">Cadastrar Nova Tarefa</h3>
                <form id="formCadastro">
                    <label for="titulo">Título da Tarefa</label>
                    <input type="text" id="titulo" placeholder="Ex: Regar as Samambaias" required>

                    <label for="descricao">Descrição</label>
                    <textarea id="descricao" rows="4" placeholder="Descreva os detalhes da tarefa" required></textarea>

                    <label for="prazo">Prazo (Data Prevista)</label>
                    <input type="date" id="prazo" required>

                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Pendente">⏳ Pendente</option>
                        <option value="Concluída">✅ Concluída</option>
                    </select>

                    <button type="submit" class="btn-principal">Confirmar Cadastro</button>
                </form>
            </section>
        </div>
    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>

    <script src="js/tarefas.js"></script>
</body>
</html>
