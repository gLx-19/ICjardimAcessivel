<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Tags NFC</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header id="cabecalhoNav" role="banner">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Logotipo verde com folhas do Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav" aria-label="Navegação de retorno">
                <a href="menuUsuario.html">⬅ Voltar ao Menu Inicial</a>
            </nav>
        </div>
    </header>

    <main class="container" role="main">
        <div class="card">
            <div class="nomes">
                <h2>📱 Tags NFC</h2>
                <p>Gerencie as tags NFC vinculadas às plantas.</p>
                <button id="btnNovaTag" class="btn-principal" style="margin-top: 15px; background-color: #28a745; width: auto; padding: 10px 20px;" aria-label="Abrir formulário para cadastrar nova tag NFC">
                    ➕ Cadastrar Nova Tag
                </button>
            </div>

            <section class="pesquisa" aria-labelledby="tituloPesquisa">
                <h3 id="tituloPesquisa">Pesquisar Tag</h3>
                <form id="formPesquisa" role="search" aria-label="Formulário de pesquisa de Tags NFC">
                    <input type="search" id="pesquisa" placeholder="Digite o código NFC ou nome da planta" aria-label="Termo de pesquisa de tag">
                    <button type="submit" class="btn-pesquisar">🔍 Pesquisar</button>
                </form>
            </section>

            <section class="lista-plantas" aria-labelledby="tituloLista">
                <h3 id="tituloLista">Tags cadastradas</h3>
                <div id="listaTags" aria-live="polite" aria-label="Lista de resultados de tags">
                </div>
            </section>

            <section class="cadastro" style="display: none;" aria-labelledby="tituloCadastro">
                <h3 id="tituloCadastro">Cadastrar Nova Tag</h3>
                <form id="formCadastro" aria-label="Formulário de vinculação de tag NFC">
                    <label for="codigo">Código NFC</label>
                    <input type="text" id="codigo" placeholder="Ex.: NFC0001" required aria-required="true">

                    <label for="jardimTag">Jardim Vinculado</label>
                    <select id="jardimTag" required aria-required="true">
                        <option value="">Carregando jardim...</option>
                    </select>

                    <label for="planta">Planta vinculada</label>
                    <select id="planta" required aria-required="true">
                        <option value="">Carregando plantas...</option>
                    </select>

                    <button type="submit" class="btn-principal">Confirmar Cadastro</button>
                </form>
            </section>
        </div>
    </main>

    <footer id="rodapeGlobal" role="contentinfo">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>
    <script src="js/tag.js"></script>
</body>
</html>
