<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Tags NFC</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>

            <nav class="menu-nav">
                <a href="menuUsuario.html">⬅ Voltar ao Menu Inicial</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <div class="card">

            <div class="nomes">
                <h2>📱 Tags NFC</h2>
                <p>Gerencie as tags NFC vinculadas às plantas.</p>
            </div>

            <section class="pesquisa">
                <h3>Pesquisar Tag</h3>
                <form id="formPesquisa">
                    <input type="text" id="pesquisa" placeholder="Digite o código NFC ou nome da planta">
                    <button type="submit" class="btn-pesquisar">🔍 Pesquisar</button>
                </form>
            </section>

            <section class="lista-plantas">
                <h3>Tags cadastradas</h3>
                <div id="listaTags">
                    </div>
            </section>

            <section class="cadastro">
                <h3>Cadastrar Nova Tag</h3>
                <form id="formCadastro">

                    <label for="codigo">
                        Código NFC
                    </label>
                    <input type="text" id="codigo" placeholder="Ex.: NFC0001" required>

                    <label for="planta">
                        Planta vinculada
                    </label>
                    <select id="planta" required>
                        <option value="">Carregando plantas...</option>
                        </select>

                    <button type="submit" class="btn-principal">
                        Confirmar Cadastro
                    </button>

                </form>
            </section>

        </div>

    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>

    <script src="js/tag.js"></script>
</body>

</html>
