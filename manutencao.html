<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Manutenções</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   <header id="cabecalhoNav" role="banner">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Logotipo verde com folhas do Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav" aria-label="Navegação de retorno">
                <a href="menuUsuario.html">⬅ Voltar ao Menu Inicial</a>
            </nav>
        </div>
    </header>

    <main class="container" role="main">
        <div class="card">
            <div class="nomes">
                <h2>🛠 Manutenções</h2>
                <p>Gerencie os registros de manutenção dos jardins.</p>
                <button id="btnNovaManutencao" class="btn-principal" style="margin-top: 15px; background-color: #28a745; width: auto; padding: 10px 20px;" aria-label="Abrir formulário para registrar nova manutenção">
                    ➕ Registrar Nova Manutenção
                </button>
            </div>

            <section class="pesquisa" aria-labelledby="tituloPesquisa">
                <h3 id="tituloPesquisa">Pesquisar Manutenção</h3>
                <form id="formPesquisa" role="search" aria-label="Formulário de pesquisa de manutenções">
                    <input type="search" id="pesquisa" placeholder="Pesquisar por descrição ou jardim" aria-label="Termo de pesquisa de manutenção">
                    <button type="submit" class="btn-pesquisar">🔍 Pesquisar</button>
                </form>
            </section>

            <section class="lista-plantas" aria-labelledby="tituloLista">
                <h3 id="tituloLista">Manutenções cadastradas</h3>
                <div id="listaManutencoes" aria-live="polite" aria-label="Lista de resultados de manutenções">
                </div>
            </section>

            <section class="cadastro" aria-labelledby="tituloCadastro">
                <h3 id="tituloCadastro">Cadastrar Manutenção</h3>
                <form id="formCadastro" aria-label="Formulário de registro de manutenção">
                    <label for="data">Data do Registro</label>
                    <input type="date" id="data" required aria-required="true">

                    <label for="jardim">Jardim Vinculado</label>
                    <select id="jardim" required aria-required="true">
                    </select>

                    <label for="descricao">Descrição dos Procedimentos</label>
                    <textarea id="descricao" rows="5" placeholder="Descreva as tarefas feitas (Ex: Rega da lavanda, poda, adubação)" required aria-required="true"></textarea>

                    <button type="submit" class="btn-principal">Confirmar Registro</button>
                </form>
            </section>
        </div>
    </main>

    <footer id="rodapeGlobal" role="contentinfo">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>
    <script src="js/manutencao.js"></script>
</body>
</html>
