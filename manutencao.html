<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Manutenções</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="cabecalho">
        <h1>Plantae Acessível</h1>
    </header>

    <main class="container">

        <div class="card">

            <div class="nomes">
                <h2>🛠 Manutenções</h2>
                <p>Gerencie os registros de manutenção das plantas.</p>
            </div>

            <!-- PESQUISA -->

            <section class="pesquisa">

                <h3>Pesquisar Manutenção</h3>

                <form id="formPesquisa">

                    <input
                        type="text"
                        id="pesquisa"
                        placeholder="Pesquisar por planta, responsável ou tipo">

                    <button
                        type="submit"
                        class="btn-pesquisar">

                        🔍 Pesquisar

                    </button>

                </form>

            </section>

            <!-- LISTA -->

            <section class="lista-plantas">

                <h3>Manutenções cadastradas</h3>

                <div id="listaManutencoes">

                    <div class="planta-item">

                        <span>
                            🌿 Lavanda - Rega (10/06/2026)
                        </span>

                        <div class="acoes">

                            <button class="btn-ver">
                                Ver
                            </button>

                            <button class="btn-editar">
                                Editar
                            </button>

                            <button class="btn-excluir">
                                Excluir
                            </button>

                        </div>

                    </div>

                </div>

            </section>

            <!-- CADASTRO -->

            <section class="cadastro">

                <h3>Cadastrar Manutenção</h3>

                <form id="formCadastro">

                    <label for="data">
                        Data
                    </label>

                    <input
                        type="date"
                        id="data"
                        required>

                    <label for="tipo">
                        Tipo de manutenção
                    </label>

                    <select id="tipo">

                        <option>Rega</option>
                        <option>Poda</option>
                        <option>Adubação</option>
                        <option>Limpeza</option>
                        <option>Controle de Pragas</option>
                        <option>Outro</option>

                    </select>

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        rows="4"
                        placeholder="Descreva a manutenção realizada">
                    </textarea>

                    <label for="responsavel">
                        Responsável
                    </label>

                    <input
                        type="text"
                        id="responsavel"
                        placeholder="Nome do responsável">

                    <label for="planta">
                        Planta
                    </label>

                    <select id="planta">

                        <option>Lavanda</option>
                        <option>Samambaia</option>
                        <option>Rosa</option>

                    </select>

                    <button
                        type="submit"
                        class="btn-principal">

                        Confirmar Cadastro

                    </button>

                </form>

            </section>

        </div>

    </main>

    <script src="js/manutencao.js"></script>

</body>

</html>
