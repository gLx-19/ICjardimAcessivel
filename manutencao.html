<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Manutenções</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

   <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav">
                <a href="menuUsuario.html">⬅ Voltar ao Menu Inicial</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card">
            <div class="nomes">
                <h2>🛠 Manutenções</h2>
                <p>Gerencie os registros de manutenção dos jardins.</p>
                
                <button id="btnNovaManutencao" class="btn-principal" style="margin-top: 15px; background-color: #28a745; width: auto; padding: 10px 20px;">
                    ➕ Registrar Nova Manutenção
                </button>
            </div>

            <section class="pesquisa">
                <h3>Pesquisar Manutenção</h3>
                <form id="formPesquisa">
                    <input type="text" id="pesquisa" placeholder="Pesquisar por descrição ou jardim">
                    <button type="submit" class="btn-pesquisar">🔍 Pesquisar</button>
                </form>
            </section>

            <section class="lista-plantas">
                <h3>Manutenções cadastradas</h3>
                <div id="listaManutencoes">
                    </div>
            </section>

            <section class="cadastro">
                <h3>Cadastrar Manutenção</h3>
                <form id="formCadastro">
                    <label for="data">Data do Registro</label>
                    <input type="date" id="data" required>

                    <label for="jardim">Jardim Vinculado</label>
                    <select id="jardim" required>
                        </select>

                    <label for="descricao">Descrição dos Procedimentos</label>
                    <textarea id="descricao" rows="5" placeholder="Descreva as tarefas feitas (Ex: Rega da lavanda, poda, adubação)" required></textarea>

                    <button type="submit" class="btn-principal">Confirmar Registro</button>
                </form>
            </section>
        </div>
    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>

    <script src="js/manutencao.js"></script>
</body>
</html>
