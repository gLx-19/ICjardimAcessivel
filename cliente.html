

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Cadastro de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <header class="bg-success text-white py-3 shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <img src="imagens/logo.png" alt="Plantae Acessível" width="40" height="40" onerror="this.style.display='none'">
                <h1 class="h4 m-0">Plantae Acessível</h1>
            </div>
            <nav>
                <a href="login.html" class="text-white text-decoration-none fw-semibold">
                    ⬅ Voltar para o Login
                </a>
            </nav>
        </div>
    </header>

    <div class="container d-flex flex-column align-items-center justify-content-center min-vh-100 py-5">

        <form id="formCadastroUsuario" class="p-4 border rounded shadow-sm bg-white" style="width: 100%; max-width: 500px;">
            <fieldset>
                <legend class="text-center mb-4 text-success fw-bold">
                    Criar Nova Conta
                </legend>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="nome">Nome Completo</label>
                    <input class="form-control" id="nome" type="text" placeholder="Digite seu nome" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="cpf">CPF</label>
                    <input class="form-control" id="cpf" type="text" placeholder="Apenas números" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="email">E-mail</label>
                    <input class="form-control" id="email" type="email" placeholder="seu@email.com" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold" for="senha">Senha</label>
                    <input class="form-control" id="senha" type="password" placeholder="Crie uma senha" required>
                </div>

                <button class="btn btn-success w-100 fw-bold" type="submit">
                    Finalizar Cadastro
                </button>
            </fieldset>
        </form>

    </div>

    <script src="js/cliente.js"></script>
</body>

</html>
