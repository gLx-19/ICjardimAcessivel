<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plantae Acessível - Cadastro de Usuário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo principal</a>

    <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Logotipo do Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>
            <nav class="menu-nav" aria-label="Navegação de retorno">
                <a href="login.html" aria-label="Voltar para a tela de login">
                    Voltar para o Login
                </a>
            </nav>
        </div>
    </header>

    <main id="conteudo-principal" class="container d-flex flex-column align-items-center justify-content-center py-5" tabindex="-1">
        <form id="formCadastroUsuario" class="p-4 border rounded shadow-sm bg-white form-cadastro-usuario" aria-label="Formulário de criação de nova conta">
            <fieldset>
                <legend class="text-center mb-4 fw-bold">Criar Nova Conta</legend>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="nome">Nome Completo</label>
                    <input class="form-control" id="nome" type="text" autocomplete="name" placeholder="Digite seu nome" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="cpf">CPF</label>
                    <input class="form-control" id="cpf" type="text" inputmode="numeric" placeholder="Apenas números (Ex: 12345678901)" maxlength="11" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold" for="senha">Senha</label>
                    <input class="form-control" id="senha" type="password" autocomplete="new-password" placeholder="Crie uma senha" required>
                </div>

                <button class="btn-principal w-100 fw-bold" type="submit" aria-label="Finalizar e confirmar o cadastro">
                    Finalizar Cadastro
                </button>
            </fieldset>
        </form>
    </main>

    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>

    <script src="js/cliente.js"></script>
</body>
</html>
