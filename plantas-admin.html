<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Plantas</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="cabecalhoNav">
        <div class="header-container">
            <div class="logo-area">
                <img src="imagens/logo.png" alt="Plantae Acessível" class="logo-img">
                <h1>Plantae Acessível</h1>
            </div>

            <nav class="menu-nav">
                <a href="menuUsuario.html">⬅ Voltar ao Menu Inicial</a>
            </nav>
        </div>
    </header>

    <main class="container">

        <div class="card">

            <div class="nomes">
                <h2>🌿 Plantas</h2>
                <p>Pesquise uma planta cadastrada ou registre uma nova.</p>
            </div>

            <!-- PESQUISA -->

            <section class="pesquisa">

                <h3>Pesquisar Planta</h3>

                <form id="formPesquisa">

                    <input type="text" id="pesquisa" placeholder="Digite o nome da planta">

                    <button type="submit" class="btn-pesquisar">

                        🔍 Pesquisar

                    </button>

                </form>

            </section>

            <!-- RESULTADOS -->

            <section class="lista-plantas">

                <h3>Plantas cadastradas</h3>

                <div id="listaPlantas">

                    <!-- As plantas serão inseridas aqui pelo JavaScript -->

                </div>

            </section>

            <!-- CADASTRO -->

            <section class="cadastro">

                <h3>Cadastrar Nova Planta</h3>

                <form id="formCadastro">

                    <label>Nome da planta</label>
                    <input type="text" id="nome" required>

                    <label>Nome científico</label>
                    <input type="text" id="cientifico">

                    <label>Família botânica</label>
                    <input type="text" id="familia">

                    <label>Descrição</label>

                    <textarea id="descricao" rows="4">
            </textarea>

                    <label>Luminosidade</label>

                    <select id="luminosidade">

                        <option>Sol pleno</option>
                        <option>Meia sombra</option>
                        <option>Sombra</option>

                    </select>

                    <label>Frequência de rega</label>

                    <input type="text" id="rega" placeholder="Ex.: 2 vezes por semana">

                    <label>Frequência de poda</label>

                    <input type="text" id="poda" placeholder="Ex.: A cada 3 meses">

                    <label>Conteúdo em áudio</label>

                    <input type="file" id="audio" accept="audio/*">

                    <label>Conteúdo em Libras</label>

                    <input type="file" id="libras" accept="video/*">

                    <label>Imagem da planta</label>

                    <input type="file" id="imagem" accept="image/*">

                    <button type="submit" class="btn-principal">

                        Confirmar Cadastro

                    </button>

                </form>

            </section>

        </div>

    </main>
    <footer id="rodapeGlobal">
        <div class="footer-container">
            <p>&copy; 2026 Plantae Acessível - Desenvolvido com foco em acessibilidade botânica.</p>
            <p>CEFET-MG - Campus VII Timóteo</p>
        </div>
    </footer>
    <script src="js/plantas-admin.js"></script>

</body>

</html>
